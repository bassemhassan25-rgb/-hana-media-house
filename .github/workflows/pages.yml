name: Deploy HANA website to GitHub Pages
on:
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check && npm test && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live website
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "$SITE_URL" -o /tmp/hana-live.html
          grep -q 'HANA Media House' /tmp/hana-live.html
          grep -q 'id="project"' /tmp/hana-live.html
          grep -q 'assets/hero-camera.svg' /tmp/hana-live.html
          grep -q 'id="gulf-projects"' /tmp/hana-live.html
          grep -q 'id="healthcare-wellness"' /tmp/hana-live.html
          grep -q 'id="fitness-sports"' /tmp/hana-live.html
          for asset in styles.css app.js content.js assets/coast.svg assets/hero-camera.svg assets/favicon.svg assets/hana-brand-artwork.webp assets/hana-brand-artwork-640.webp assets/hana-share.jpg; do
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors "${SITE_URL}${asset}" -o /dev/null
          done
          echo "Live HANA HTML and required assets verified at $SITE_URL"
          curl --fail --silent --show-error "${SITE_URL}content.js" -o /tmp/hana-live-content.js
          grep -oE 'assets/(gulf|healthcare|fitness)/[a-zA-Z0-9_-]+\.(mp4|webp)' /tmp/hana-live-content.js | sort -u | while read -r asset; do
            curl --fail --silent --show-error --head --retry 3 --retry-all-errors "${SITE_URL}${asset}" -o /dev/null
          done
          echo "Live portfolio sections and all configured Gulf, healthcare and fitness video/poster URLs verified."
          grep -q 'assets/hana-brand-artwork.webp' /tmp/hana-live.html
          grep -q 'property="og:site_name" content="HANA Media House"' /tmp/hana-live.html
          grep -q 'property="og:image" content="https://bassemhassan25-rgb.github.io/-hana-media-house/assets/hana-share.jpg"' /tmp/hana-live.html
          grep -q 'name="twitter:image" content="https://bassemhassan25-rgb.github.io/-hana-media-house/assets/hana-share.jpg"' /tmp/hana-live.html
          grep -q 'Creative vision.' /tmp/hana-live-content.js
          grep -q 'International experience.' /tmp/hana-live-content.js
          echo "Live About artwork/copy and absolute HTTPS Open Graph/Twitter metadata verified."
          grep -q 'Creative vision.' /tmp/hana-live.html
          grep -q 'International experience.' /tmp/hana-live.html
          grep -q 'HANA Media House brings together photography' /tmp/hana-live.html
