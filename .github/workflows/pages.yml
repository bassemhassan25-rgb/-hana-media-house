name: Deploy HANA website to GitHub Pages
on:
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check && npm test && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live website
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "$SITE_URL" -o /tmp/hana-live.html
          grep -q 'HANA Media House' /tmp/hana-live.html
          grep -q 'id="project"' /tmp/hana-live.html
          grep -q 'assets/hero-camera.svg' /tmp/hana-live.html
          for asset in styles.css app.js content.js assets/coast.svg assets/hero-camera.svg assets/favicon.svg; do
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors "${SITE_URL}${asset}" -o /dev/null
          done
          echo "Live HANA HTML and required assets verified at $SITE_URL"
