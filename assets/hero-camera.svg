 <path d="M595 421v317l-58 16V455z" fill="#20313c"/>
 <path d="m596 738 290-43-2 65-263 51-84-57z" fill="#12212b"/>
 <rect x="608" y="467" width="143" height="103" rx="8" fill="#091621" stroke="#63808a"/>
 <rect x="619" y="479" width="121" height="79" rx="3" fill="url(#sunset)"/>
 <path d="M619 532q55-20 121 3v23H619" fill="#274f5d"/><circle cx="712" cy="507" r="14" fill="#f0c49c"/>
 <path d="M611 597h106M611 610h106M611 623h106" stroke="#091822" stroke-width="6"/>
 <circle cx="626" cy="671" r="18" fill="url(#metal)" stroke="#77908f"/><circle cx="626" cy="671" r="9" stroke="#c39076"/>
 <circle cx="679" cy="666" r="9" fill="#131f2a" stroke="#6e8889"/>
 <rect x="716" y="649" width="23" height="14" rx="3" fill="#d17d66"/>
 <path d="M548 481v186" stroke="#77918f" stroke-width="3" stroke-dasharray="2 7"/>
 <path d="M757 443h53l39 28" stroke="#94a6a1" stroke-width="3"/>
 <!-- Side grip -->
 <path d="m829 516 74 10 39 45-8 147-53 33-63-23z" fill="#12212c" stroke="#698186" stroke-width="2"/>
 <path d="m878 551 27 16-5 136-24 13" stroke="#3e5360" stroke-width="15"/>
