 <g stroke="#6da5a8" stroke-opacity=".6"><ellipse cx="1051" cy="654" rx="98" ry="122"/><ellipse cx="1051" cy="654" rx="75" ry="94"/><ellipse cx="1051" cy="654" rx="50" ry="64"/></g>
 <path d="m1023 589 52-1 30 45-11 52-49 30-46-28-14-51z" fill="#061321" stroke="#638c94" stroke-opacity=".5"/>
