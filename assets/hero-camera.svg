 <path d="M779 499q63-31 111 9l154 18v265l-154 19q-63 28-111-12z" fill="url(#metal)" stroke="#6e858a" stroke-width="2"/>
 <path d="M832 500v306M857 506v298M887 509v296" stroke="#090f19" stroke-width="12"/>
 <path d="M833 505v292M858 510v283" stroke="#73858c" stroke-width="2"/>
 <path d="M909 520h109v271H909z" fill="url(#ridges)"/>
 <ellipse cx="1035" cy="656" rx="163" ry="193" fill="#101c29" stroke="#667f87" stroke-width="3"/>
