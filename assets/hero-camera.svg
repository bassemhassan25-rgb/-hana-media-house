 <circle cx="230" cy="92" r="22" fill="#ffe0ab"/>
 <path d="M125 147 302 124v7l-177 23Zm30 4v20m28-25v24m30-28v20m30-24v22m27-26v20" fill="#1a3543" stroke="#1a3543" stroke-width="3"/>
