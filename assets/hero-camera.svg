 <path d="m72 148 23-56v56zm28-6v-40l24 40z" fill="#f7d8b7"/><path d="M67 153h63l-12 8H78z" fill="#193d4d"/>
 <path d="M20 195h280M20 211h280M20 227h280" stroke="#3b515d"/>
 <path d="M25 195h67m10 0h83m8 0h95" stroke="#67afa2" stroke-width="8"/><path d="M45 210h105m7 0h114" stroke="#cc826b" stroke-width="8"/><path d="M25 226h185" stroke="#708bba" stroke-width="7"/>
 <path d="M167 185v52" stroke="#f2dec0" stroke-width="1"/>
</g></g>
<!-- Social content card -->
<g class="float-b"><g transform="translate(1125 590) rotate(12)"><rect width="168" height="242" rx="14" fill="#1d3440" stroke="#6e9a9a"/><circle cx="20" cy="21" r="7" fill="#df9479"/><path d="M36 18h68m-68 7h43" stroke="#83a1a3" stroke-width="3"/><rect x="10" y="40" width="148" height="150" rx="5" fill="#d1c6ac"/><circle cx="116" cy="86" r="42" fill="#e68e70"/><path d="M10 163q70-70 148-13v40H10" fill="#628d88"/><path d="M62 90h40v69H62z" fill="#f5f0dd"/><path d="M68 84h28v10H68" fill="#416e6d"/><path d="M14 207h10m8 0h10m8 0h10M14 223h98" stroke="#9db7b3" stroke-width="3"/></g></g>
<!-- Motion orbital and film strip accents -->
<g class="float-b"><g transform="translate(440 300)"><ellipse rx="73" ry="25" transform="rotate(-35)" stroke="#7cbfb1" stroke-width="3"/><ellipse rx="73" ry="25" transform="rotate(35)" stroke="#ed9678" stroke-width="3"/><circle r="19" fill="url(#teal)"/></g></g>
<g opacity=".65" transform="translate(375 745) rotate(-13)"><rect width="184" height="97" rx="3" stroke="#6f9697"/><path d="M0 15h184M0 82h184" stroke="#6f9697"/><path d="M10 7h164M10 90h164" stroke="#6f9697" stroke-width="5" stroke-dasharray="8 10"/><path d="m78 32 29 17-29 17z" stroke="#ec9a7a" stroke-width="2"/></g>
