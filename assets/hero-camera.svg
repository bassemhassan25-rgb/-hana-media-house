<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" fill="none">
<title>Cinematic creative studio</title><desc>An original cinema camera and illuminated lens surrounded by editing frames, social layouts and motion graphics, with a Pacific sunset and pier on its monitor.</desc>
<defs>
 <linearGradient id="body" x1="400" y1="350" x2="900" y2="850" gradientUnits="userSpaceOnUse"><stop stop-color="#50616a"/><stop offset=".25" stop-color="#25343e"/><stop offset=".65" stop-color="#101b25"/><stop offset="1" stop-color="#34434b"/></linearGradient>
 <linearGradient id="edge"><stop stop-color="#a3b6b5"/><stop offset=".45" stop-color="#263c45"/><stop offset="1" stop-color="#ed9574"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1620"/><stop offset=".4" stop-color="#4a5c65"/><stop offset=".48" stop-color="#1b2b36"/><stop offset="1" stop-color="#080f17"/></linearGradient>
 <radialGradient id="glass" cx=".35" cy=".3"><stop stop-color="#72bbbd"/><stop offset=".2" stop-color="#295e72"/><stop offset=".45" stop-color="#12283e"/><stop offset=".65" stop-color="#1f4855"/><stop offset=".83" stop-color="#122534"/><stop offset="1" stop-color="#050d16"/></radialGradient>
 <radialGradient id="halo"><stop stop-color="#fa8c63" stop-opacity=".28"/><stop offset=".55" stop-color="#cf765d" stop-opacity=".08"/><stop offset="1" stop-color="#ed8d63" stop-opacity="0"/></radialGradient>
 <linearGradient id="sunset" x2="0" y2="1"><stop stop-color="#425f6a"/><stop offset=".5" stop-color="#f59c7c"/><stop offset=".65" stop-color="#f2c198"/><stop offset=".66" stop-color="#567f83"/><stop offset="1" stop-color="#1b4655"/></linearGradient>
 <linearGradient id="beam"><stop stop-color="#ffb082" stop-opacity="0"/><stop offset=".65" stop-color="#ff9b72" stop-opacity=".08"/><stop offset="1" stop-color="#ff9b72" stop-opacity=".3"/></linearGradient>
 <linearGradient id="teal"><stop stop-color="#81d1c3"/><stop offset="1" stop-color="#1d5967"/></linearGradient>
 <pattern id="ridges" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M1 0v9" stroke="#99aaab" stroke-opacity=".25" stroke-width="2"/></pattern>
 <filter id="shadow" x="-.4" y="-.4" width="1.8" height="1.8"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<style>
.float-a{animation:float-a 4.8s ease-in-out 1}.float-b{animation:float-b 4.8s ease-in-out 1}.lens-light{animation:glow 4.8s ease-in-out 1}.light-ray{animation:light 4.8s ease-in-out 1;transform-origin:900px 620px}
@keyframes float-a{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}@keyframes float-b{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}@keyframes light{0%,100%{opacity:.4;transform:rotate(0deg)}50%{opacity:1;transform:rotate(3deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!-- Sunset light and fine production-frame details -->
<ellipse cx="885" cy="570" rx="550" ry="500" fill="url(#halo)"/>
<g stroke="#547078" stroke-opacity=".3"><path d="M210 235h55m-28-28v55M1260 760h55m-28-28v55M1200 145h40v40M265 850v35h35"/><path d="M360 150h570M1230 320v340" stroke-dasharray="2 12"/></g>
<path class="light-ray" d="M900 620 1100 110 1390 250Z" fill="url(#beam)"/>
<path d="M250 934h1070" stroke="#7eaaa7" stroke-opacity=".3"/>
<path d="M350 945q400-40 850 0" stroke="#5f8a90" stroke-opacity=".15"/>
<ellipse cx="830" cy="911" rx="380" ry="47" fill="#020b12" opacity=".7" filter="url(#shadow)"/>
